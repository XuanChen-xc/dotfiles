# ~/.tmux.conf
# Personal tmux configuration for remote development.

# -----------------------------------------------------------------------------
# Basic usability
# -----------------------------------------------------------------------------

# Enable mouse scrolling, pane selection, and window selection.
set -g mouse on

# Broadly compatible 256-color terminal setting.
set -g default-terminal "screen-256color"

# Keep plenty of scrollback history.
set -g history-limit 50000

# Automatically renumber windows after one is closed.
set-option -g renumber-windows on

# Start window and pane numbering at 1, which matches keyboard number keys.
set -g base-index 1
setw -g pane-base-index 1

# Reduce the delay after pressing Escape.
set -sg escape-time 10

# Increase message display duration slightly.
set -g display-time 2000

# -----------------------------------------------------------------------------
# Window navigation / organization
# -----------------------------------------------------------------------------

# Reorder windows with Ctrl-Shift-Left / Ctrl-Shift-Right.
bind-key -n C-S-Left  swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Split panes while keeping the current working directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# Create a new window in the current working directory.
bind c new-window -c "#{pane_current_path}"

# Reload configuration without restarting tmux.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# -----------------------------------------------------------------------------
# Copy / terminal behavior
# -----------------------------------------------------------------------------

# Use tmux's default copy-mode keybindings (not Vim keybindings).

# Keep Ctrl-L's normal shell behavior.
# We intentionally do NOT clear tmux scrollback so previous logs remain available.

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------

# Refresh status information frequently enough for CPU/RAM plugins.
set -g status-interval 5

# -----------------------------------------------------------------------------
# Plugins (TPM)
# -----------------------------------------------------------------------------
# Install TPM once with:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# Then, inside tmux, press:
#   Prefix + I
# to install configured plugins.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Optional status-line theme with CPU / RAM information.
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "cpu-usage ram-usage"
set -g @dracula-cpu-display-load true
set -g @dracula-show-left-icon shortname

# Initialize TPM if installed.
if-shell "[ -x ~/.tmux/plugins/tpm/tpm ]" \
    "run '~/.tmux/plugins/tpm/tpm'"
